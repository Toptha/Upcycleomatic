<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Upcycle App</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>
    <div style="max-width:900px;margin:28px auto;color:#222;background:#fff;padding:20px;border-radius:10px;">
        <h1 id="title">Welcome</h1>
        <p id="intro">Loading...</p>
        <button id="home">Back to Home</button>
    </div>

    <script>
        function post(obj) { chrome.webview.postMessage(JSON.stringify(obj)); }

        chrome.webview.addEventListener('message', ev => {
            try {
                const d = JSON.parse(ev.data);
                if (d.type === 'auth' && d.status === 'ok') {
                    document.getElementById('title').innerText = 'Hello, ' + (d.user || 'friend');
                    document.getElementById('intro').innerText = 'Welcome to Upcycle-O-Matic. Try adding an idea from the desktop UI.';
                }
            } catch (e) { }
        });

        document.getElementById('home').onclick = () => post({ action: 'goHome' });
    </script>
</body>
</html>
